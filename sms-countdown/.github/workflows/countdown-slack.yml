name: Daily Slack Countdown

# Same schedule as the SMS version, but posts to Slack instead.
#
# IMPORTANT: pick ONE of the two workflows (this one or countdown.yml).
# If you enable both, you'll get two messages a day. To use only Slack,
# delete .github/workflows/countdown.yml.

on:
  # GitHub Actions cron is ALWAYS in UTC. Hawaii (HST) is UTC-10 with no
  # daylight saving, so 8:00 AM HST = 18:00 UTC. We use 18:07 because the
  # free scheduler can lag at the top of the hour.
  schedule:
    - cron: "7 18 * * *"

  # Lets you trigger a run by hand from the Actions tab to test it.
  workflow_dispatch:

jobs:
  send-countdown:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository code (countdown.py + countdown_slack.py).
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Install Python 3. No pip install needed — the Slack script uses
      #    only the Python standard library.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Run the script. The single Slack secret is passed in as an
      #    environment variable; it is never written into the code.
      - name: Post the countdown to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python countdown_slack.py
